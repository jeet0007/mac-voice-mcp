# Keeps dependencies and GitHub Actions current. Security fixes arrive as soon as an advisory is published;
# routine updates are batched weekly into one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @types/node should match the oldest Node.js we support, not the newest,
      # so the compiler flags APIs that don't exist on older runtimes.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
