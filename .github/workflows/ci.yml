name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      # Two jobs cover it: macOS, where people use it, on the oldest supported Node (22); and Linux on
      # the newest (26), which is fast, keeps the espeak-ng path working, and catches Mac-only
      # assumptions. The real speech round trip is its own workflow (speech.yml), run when speech code changes.
      matrix:
        include:
          - { os: macos-latest, node: 22 }
          - { os: ubuntu-latest, node: 26 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The call bubble is built on users' Macs from source, so a broken one must fail here.
      - if: runner.os == 'macOS'
        run: swiftc -typecheck native/call-bubble.swift
      - run: npm test
