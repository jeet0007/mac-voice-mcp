# Leaked secrets, vulnerable dependencies — on every push and pull request, and weekly.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # Mondays, catches newly published advisories
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, so old commits are scanned too
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Known vulnerabilities in runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Signatures and provenance of installed packages
        run: npm audit signatures

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
